name: Firmware release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Create build configuration
        run: cp firmware/include/firmware_config.example.h firmware/include/firmware_config.h
      - name: Build firmware
        run: pio run -d firmware
      - name: Prepare web installer assets
        run: |
          mkdir -p dist
          cp firmware/.pio/build/m5stack-atom-echo/firmware.bin dist/m5stack-atom-echo.bin
          cp web/manifest.json dist/manifest.json
      - name: Publish release assets
        uses: softprops/action-gh-release@v2.3.4
        with:
          files: |
            dist/m5stack-atom-echo.bin
            dist/manifest.json
      - name: Mirror installer assets to public repository
        if: ${{ secrets.INSTALLER_REPO_TOKEN != '' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.INSTALLER_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/m5stack-atom-echo.bin dist/manifest.json \
            --repo developman2013/m5stack-openai-voice-installer \
            --title "M5Stack firmware $RELEASE_TAG" \
            --notes "Firmware release mirrored from the private source repository."
