name: Firmware release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Create build configuration
        run: cp firmware/include/firmware_config.example.h firmware/include/firmware_config.h
      - name: Build firmware
        run: pio run -d firmware
      - name: Prepare web installer assets
        run: |
          mkdir -p dist
          cp firmware/.pio/build/m5stack-atom-echo/firmware.bin dist/m5stack-atom-echo.bin
          cp web/manifest.json dist/manifest.json
      - name: Publish release assets
        uses: softprops/action-gh-release@v2.3.4
        with:
          files: |
            dist/m5stack-atom-echo.bin
            dist/manifest.json
      - name: Sync installer assets to Pages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp dist/m5stack-atom-echo.bin web/assets/firmware.bin
          jq --arg version "${RELEASE_VERSION#v}" '.version = $version' web/manifest.json > web/manifest.tmp
          mv web/manifest.tmp web/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/firmware.bin web/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish firmware ${RELEASE_VERSION} to installer"
          git push origin main
          gh workflow run pages.yml --ref main
