name: OpenAI Voice Gateway
version: "0.5.1"
slug: openai_voice_gateway
description: Realtime OpenAI voice gateway with a browser demo and Home Assistant hooks
url: https://github.com/developman2013/m5stack-openai-voice-stack
image: ghcr.io/developman2013/m5stack-openai-voice-gateway
startup: services
boot: auto
init: false
host_network: true
hassio_api: true
homeassistant_api: true
webui: http://[HOST]:[PORT:8765]
arch:
  - aarch64
  - amd64
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Browser demo and websocket endpoint
options:
  continuous_conversation: true
  session_idle_seconds: 120
  gateway_token: ""
  ha_mcp_enabled: true
  ha_mcp_url: http://supervisor/core/api/mcp
  openai_api_key: ""
  openai_model: gpt-realtime-mini
  openai_voice: cedar
  instructions: >-
    You are a concise, helpful smart home voice assistant. Keep responses short
    unless more detail is requested.
  home_assistant_url: http://supervisor/core
  home_assistant_token: ""
  listen_port: 8765
  last_input_pcm_path: /home/hassio/openai-last-input.pcm
  wake_word_enabled: true
  wake_word_host: core-openwakeword
  wake_word_port: 10400
  wake_word_name: hey_jarvis
  wake_audio_gain: 8
  follow_up_timeout_ms: 5000
schema:
  continuous_conversation: bool
  session_idle_seconds: int(15,600)
  gateway_token: password
  ha_mcp_enabled: bool
  ha_mcp_url: str
  openai_api_key: password
  openai_model: str
  openai_voice: str
  instructions: str
  home_assistant_url: str
  home_assistant_token: password
  listen_port: port
  last_input_pcm_path: str
  wake_word_enabled: bool
  wake_word_host: str
  wake_word_port: port
  wake_word_name: str
  wake_audio_gain: int(1,32)
  follow_up_timeout_ms: int(1000,30000)
